spring.application.name=isa
spring.datasource.url=jbdc:mysql://localhost:3306/isa26
spring.datasource.username=root
sprint.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jbdc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
sping.jpa.show-sql=true

spring.datasource.hikari.maximum.idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari..idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari..auto-commit=true
